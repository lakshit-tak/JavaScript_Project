<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Password Generator</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <div class="card">

            <h1>Password Generator</h1>

            <div class="password-box">

                <input type="text" id="password" readonly placeholder="Your password">

                <button id="copyBtn">
                    Copy
                </button>

            </div>

            <div class="length-box">

                <label for="length">
                    Password Length:
                    <span id="lengthValue">12</span>
                </label>

                <input type="range" id="length" min="4" max="30" value="12">

            </div>

            <div class="options">

                <label>
                    <input type="checkbox" id="uppercase" checked>
                    Uppercase
                </label>

                <label>
                    <input type="checkbox" id="lowercase" checked>
                    Lowercase
                </label>

                <label>
                    <input type="checkbox" id="numbers" checked>
                    Numbers
                </label>

                <label>
                    <input type="checkbox" id="symbols" checked>
                    Symbols
                </label>

            </div>

            <button id="generateBtn" class="button">
                Generate Password
            </button>

            <button id="clear" class="button">
                Clear
            </button>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
